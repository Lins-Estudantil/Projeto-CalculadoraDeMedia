<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Calculadora de Média</h1>

        <div class="campos">
            <label>1ª nota
                <input type="number" id="nota1" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0 a 10">
            </label>
            <label>2ª nota
                <input type="number" id="nota2" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0 a 10">
            </label>
            <label>3ª nota
                <input type="number" id="nota3" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0 a 10">
            </label>
            <label>4ª nota
                <input type="number" id="nota4" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0 a 10">
            </label>
        </div>

        <button id="btn-calcular">Calcular média</button>
        <div id="resultado" class="resultado oculto"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
